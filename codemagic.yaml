# Codemagic CI/CD — SmartVillage (Flutter, Android)
#
# Builds a release APK on every push to `main`: unit tests first, then
# `flutter build apk --release`, with the committed Murya voice bundled in.
#
# The project root IS the Flutter project root (pubspec.yaml, android/,
# assets/ and this file are siblings), so no working-directory setup is needed.
#
# Release signing is optional. To sign with a real keystore:
#   1. Codemagic → Team settings → Environment variables → add a group named
#      "smartvillage_signing" with CM_KEYSTORE (base64 .jks), CM_KEYSTORE_PASSWORD,
#      CM_KEY_ALIAS and CM_KEY_PASSWORD.
#   2. Uncomment the `groups:` block under `environment:` below.
# Until then android/app/build.gradle falls back to the debug signing key and
# the APK still installs on a device.
#
# Docs: https://docs.codemagic.io/yaml/building-a-flutter-app/

workflows:
  android-release:
    name: Android Release (APK)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      # Required by Codemagic's macOS instance schema; the Android toolchain
      # comes with the Flutter image.
      xcode: latest
      cocoapods: default
      # Uncomment after creating the "smartvillage_signing" group (see header).
      # groups:
      #   - smartvillage_signing
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/Homebrew
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      # Do not spend mac_mini_m2 minutes on superseded commits.
      cancel_previous_builds: true
    scripts:
      - name: Diagnostics
        script: |
          echo "Flutter: $(flutter --version | head -1)"
          echo "Dart:    $(dart --version)"
          echo "Java:    $(java -version 2>&1 | head -1)"
          echo "Build #: ${BUILD_NUMBER:-local}"

      - name: Check Murya voice assets
        script: |
          set -e
          MODEL="assets/models/murya.onnx"
          CONFIG="assets/models/murya.onnx.json"

          if [ ! -f "$MODEL" ]; then
            echo "error: $MODEL is missing from the repository." >&2
            exit 1
          fi
          if [ ! -f "$CONFIG" ]; then
            echo "error: $CONFIG is missing - the app needs the phoneme map." >&2
            exit 1
          fi

          SIZE=$(wc -c < "$MODEL" | tr -d ' ')
          if [ "$SIZE" -lt 1048576 ]; then
            echo "error: $MODEL is only ${SIZE} bytes - truncated model." >&2
            exit 1
          fi
          MAGIC=$(head -c 1 "$MODEL" | od -An -tu1 | tr -d ' \n')
          if [ "$MAGIC" != "8" ]; then
            echo "error: $MODEL is not an ONNX protobuf (first byte $MAGIC)." >&2
            exit 1
          fi
          echo "OK: $MODEL ($((SIZE / 1024 / 1024)) MB) + config present"

      - name: Static checks
        script: python3 tool/check_dart.py

      - name: Get packages
        script: flutter pub get

      - name: Analyze
        # Informational only: the codebase was authored without a local Flutter
        # SDK, so the first analyzer pass may surface style nits. Genuine errors
        # still fail the build at `flutter test` / `flutter build apk`.
        script: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "warning: flutter analyze reported issues (exit $STATUS) - continuing"
          fi
          exit 0

      - name: Unit tests
        script: flutter test --reporter expanded

      - name: Build release APK
        script: |
          flutter build apk --release \
            --build-name=2.0.0 \
            --build-number=${BUILD_NUMBER:-1} \
            --dart-define=SMARTVILLAGE_BUILD=${BUILD_NUMBER:-1}

      - name: Report APK
        script: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "error: expected $APK was not produced" >&2
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          shasum -a 256 "$APK" | tee apk-sha256.txt

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/flutter-apk/*.apk.sha1
      - apk-sha256.txt

    publishing:
      email:
        # Only `recipients` and `notify` are valid here. External addresses must
        # confirm the opt-in email once before notifications start.
        recipients:
          - ameenujaafar432@gmail.com
        notify:
          success: true
          failure: true
